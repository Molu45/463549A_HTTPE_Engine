name: HTTPE Engine Automated Verification Pipeline

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest python-dateutil

      - name: Execute High-Throughput Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Execute Production CLI Runner
        run: |
          python main.py
